<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Tracker candidate</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>Application Tracker</h1>
    <p>Enter the candidate name exactly as it appears in the manager.</p>
    <form id="candidate-form">
      <label for="candidate-name">Candidate name</label>
      <input id="candidate-name" name="candidateName" type="text" maxlength="100" autocomplete="off" required>
      <button type="submit">Save name</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">Select a company on a job page, then use the context menu or shortcut.</p>
  </main>
</body>
</html>
